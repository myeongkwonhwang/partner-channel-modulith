spring:
  application:
    name: partner-channel-modulith

  datasource:
    url: jdbc:postgresql://localhost:5433/partner_channel
    username: pcm
    password: pcm
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  jackson:
    time-zone: Asia/Seoul

  flyway:
    enabled: true
    schemas: channel_schema,core_schema,saga_schema,logistics_schema
    default-schema: channel_schema
    create-schemas: true
    locations: classpath:db/migration/channel,classpath:db/migration/core,classpath:db/migration/saga,classpath:db/migration/logistics

  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      externalization:
        enabled: true

# 외부 채널 연동 (R6) — 비밀값은 환경변수로 주입(yml 평문 금지). 미설정 시 빈 값으로 부팅되며 실호출 시점에만 필요.
partner-channel:
  toss:
    base-url: ${TOSS_BASE_URL:}
    token-url: ${TOSS_TOKEN_URL:}
    client-id: ${TOSS_CLIENT_ID:}
    client-secret: ${TOSS_CLIENT_SECRET:}
    query-lookback-days: 31

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
