spring:
  application:
    name: partner-channel-modulith

  datasource:
    url: jdbc:postgresql://localhost:5433/partner_channel
    username: pcm
    password: pcm
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # 비즈니스 엔티티는 모두 @Table(schema=) 명시라 영향 없음. @Table(schema) 미지정인 Modulith 내장 outbox
        # 엔티티(DefaultJpaEventPublication)만 본 기본 schema 로 라우팅된다 — events_schema 의 event_publication 과 정합.
        default_schema: events_schema

  jackson:
    time-zone: Asia/Seoul

  flyway:
    # 실제 마이그레이션은 schema 별 독립 history 로 FlywayMultiSchemaConfig(FlywayMigrationStrategy)가 수행한다.
    # 4 schema baseline 이 모두 V1(모듈별 독립 버전)이라 단일 history 로 묶으면 "version 1 중복"으로 거부되기 때문.
    # 자동설정이 만드는 단일 Flyway 빈은 전략이 migrate 를 가로채 사용되지 않는다(실행 순서 보장 목적으로만 enable).
    enabled: true

  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Modulith 외부화는 이벤트를 EventSerializer(Jackson)로 직렬화한 byte[](JSON)를 넘긴다. StringSerializer 는
      # byte[] 를 못 다뤄 실패(→publication 미완), JsonSerializer 는 byte[] 를 base64 로 또 감싼다(이중 인코딩).
      # byte[] 를 그대로 토픽에 싣도록 ByteArraySerializer 를 쓴다 → 깔끔한 JSON 이 그대로 발행된다.
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer

  modulith:
    events:
      # event_publication 테이블은 Flyway(db/migration/events, events_schema)로 생성한다 — JPA 이벤트 모듈은
      # jdbc.schema-initialization(JDBC 모듈 전용) 대상이 아니므로 그 속성은 두지 않는다.
      # 앱 중지/크래시로 미완(completion_date IS NULL)으로 남은 publication 을 재시작 시 리스너에 재발행(at-least-once
      # 복구). 재발행 중복은 각 step 의 processed_event 멱등 가드가 흡수한다. (saga-레벨 stuck 복구는 R5a scanner)
      republish-outstanding-events-on-restart: true
      externalization:
        enabled: true

# 외부 채널 연동 (R6) — 비밀값은 환경변수로 주입(yml 평문 금지). 미설정 시 빈 값으로 부팅되며 실호출 시점에만 필요.
partner-channel:
  toss:
    base-url: ${TOSS_BASE_URL:}
    token-url: ${TOSS_TOKEN_URL:}
    client-id: ${TOSS_CLIENT_ID:}
    client-secret: ${TOSS_CLIENT_SECRET:}
    query-lookback-days: 31

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
